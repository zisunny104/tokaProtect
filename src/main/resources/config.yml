language: zh-TW
# standby：待命，不攔截任何事件，只能用 /protect 預先設定旗標。
# minimal：最小運作，只用本插件自己的資料（世界層旗標與預設值），不依賴 tokaRegions／tokaLand，其中一個壞了也不受影響。
# full：完整接管，加上區域層、領地層與領地外清除。
# 改成 minimal 或 full 前，請先確認 zero 的舊保護規則（Protect、block-log 的保護部分、領地外清除）已停用。
mode: standby
# 各功能可單獨關閉（minimal 時 hazards 本來就不運作）。
features:
  record: true
  explosions: true
  farmland: true
  pvp: true
  hazards: true
  pistons: true
# 某個功能在時間窗內連續出錯達次數，就自動停用該功能，其他功能照常；修好後用 /protect reset <功能> 重新啟用。
breaker:
  failures: 5
  window-seconds: 60
storage:
  backend: SQLITE
  schema-version: 1
  directory: storage
# 方塊紀錄（record 功能）。只記有明確責任人的變更：玩家放置、破壞、倒水舀水、點火，以及爆炸（含已知的來源）。
log:
  file: log/blocks.db
  # 保留天數與筆數上限，先到者先清，從最舊開始。
  retention-days: 90
  max-rows: 3000000
  # 背景寫入：佇列滿了就丟棄並計數，不會拖慢伺服器。
  queue-size: 20000
  batch-size: 500
  flush-seconds: 2
  # 清除過期紀錄的間隔。
  maintenance-minutes: 30
  # 單次爆炸最多記錄的方塊數。
  explosion-block-limit: 2000
  # 查詢最多讀取的原始筆數、相同動作合併成一行的最大間隔。
  query-rows: 300
  collapse-seconds: 60
