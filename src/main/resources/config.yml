language: zh-TW
# standby：待命，不攔截任何事件，只能用 /protect 預先設定旗標。
# minimal：最小運作，只用本插件自己的資料（世界層旗標與預設值），不依賴 tokaRegions／tokaLand，其中一個壞了也不受影響。
# full：完整接管，加上區域層、領地層與領地外清除。
mode: full
# 各功能可單獨關閉（minimal 時 hazards 本來就不運作）。
features:
  record: true
  audit: true
  explosions: true
  farmland: true
  pvp: true
  hazards: true
  pistons: true
  flight: true
# 飛行：誰能飛由權限 tokaprotect.fly 決定（可交給身分組），哪裡能飛由 fly 旗標決定（預設不開）。
# 沒被允許卻在飛（生存、冒險模式）時取消；kick-illegal 為 true 時再踢出（預設不踢，因為其他插件或指令給的飛行也會被當成違規）。有 tokaprotect.fly.bypass 的不受影響。
# 玩家身上的規則（不受 mode 影響）：死亡時保留物品與經驗；伺服器要不要自己檢查玩家的移動（false＝不檢查）。
player:
  keep-inventory: true
  keep-experience: true
  check-movement: false
flight:
  kick-illegal: false
# 某個功能在時間窗內連續出錯達次數，就自動停用該功能，其他功能照常；修好後用 /protect reset <功能> 重新啟用。
breaker:
  failures: 5
  window-seconds: 60
storage:
  backend: SQLITE
  schema-version: 1
  directory: storage
# 方塊紀錄（record 功能）。只記有明確責任人的變更：玩家放置、破壞、倒水舀水、點火，以及爆炸（含已知的來源）。
log:
  file: log/blocks.db
  # 保留天數與筆數上限，先到者先清，從最舊開始。
  retention-days: 90
  max-rows: 3000000
  # 背景寫入：佇列滿了就丟棄並計數，不會拖慢伺服器。
  queue-size: 20000
  batch-size: 500
  flush-seconds: 2
  # 清除過期紀錄的間隔。
  maintenance-minutes: 30
  # 單次爆炸最多記錄的方塊數。
  explosion-block-limit: 2000
  # 破壞或被炸時一併保留告示牌文字等小型方塊資料（用核心的方塊實體 id），讓還原能一起放回；容器內容不保存。
  tile-data: [Sign, Skull, Banner, FlowerPot]
  tile-data-max-bytes: 2048
  # 查詢最多讀取的原始筆數、相同動作合併成一行的最大間隔。
  query-rows: 300
  collapse-seconds: 60
  # 方塊還原（/protect rollback）：預覽讀取的紀錄與位置上限、每刻處理方塊數、確認時限。
rollback:
  max-rows: 200000
  max-blocks: 100000
  blocks-per-tick: 200
  confirm-seconds: 60
# 指令稽核（audit 功能）：記錄玩家、主控台、遠端輸入的指令與告示牌文字。
audit:
  file: log/commands.db
  retention-days: 30
  max-rows: 500000
  queue-size: 5000
  maintenance-minutes: 30
  # 單筆最長保留幾個字。
  max-text: 256
  # 這些指令只記指令名稱，後面的引數一律遮成 ****（密碼、綁定碼）。不分大小寫、不含斜線。
  hidden-commands: [login, register, unregister, changepassword, logout, dc, discord, bind]
  # 是否轉發到 Discord 指令頻道（需要 tokaDiscordLink）。
  discord: false
  discord-channel: cmd
  query-rows: 300
